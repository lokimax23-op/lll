{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Student - Confirmation</title>
    <link rel="stylesheet" href="{% static 'css/student-theme.css' %}">
</head>
<body>
    <div class="page-shell">
        <div class="card delete-card">
            <header class="page-header"><p class="eyebrow">Confirm Action</p><h1>Delete Student</h1></header>
            <div class="delete-content"><p class="delete-message">Are you sure you want to delete<strong>{{ student.first_name }} {{ student.last_name }}</strong>This action cannot be undone and will permanently remove this student record.</p></div>
            <form method="post" class="delete-form"><div class="form-actions">{% csrf_token %}<button type="submit" class="btn btn-danger">Yes, Delete Permanently</button><a href="{% url 'student_detail' student.pk %}" class="btn btn-secondary">Cancel</a></div></form>
        </div>
    </div>
</body>
</html>
