{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(
                135deg,
                #080808,
                #170606,
                #090909
            );
            font-family: Arial, sans-serif;
        }

        .logout-container {
            width: min(100%, 380px);
            padding: 35px;
            background: linear-gradient(
                145deg,
                #171717,
                #0d0d0d
            );
            border: 1px solid #7f1d1d;
            border-radius: 18px;
            box-shadow:
                0 0 25px rgba(220, 38, 38, 0.15),
                0 20px 50px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
            text-align: center;
        }

        .logout-container h2 {
            color: #22c55e;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .logout-container p {
            color: #d1d5db;
            margin-bottom: 30px;
            font-size: 14px;
            line-height: 1.6;
        }

        .logout-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(
                135deg,
                #dc2626,
                #991b1b
            );
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .logout-btn:hover {
            background: linear-gradient(
                135deg,
                #ef4444,
                #dc2626
            );
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.4);
            transform: translateY(-2px);
        }

        .logout-btn:active {
            transform: translateY(0);
        }

        .success-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .logout-container {
                padding: 24px 18px;
                border-radius: 14px;
            }

            .logout-container h2 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <div class="success-icon">✓</div>
        <h2>Successfully Logged Out</h2>
        <p>You have been logged out of your account. Thank you for using our application!</p>
        <a href="{% url 'home' %}" class="logout-btn">Return to Home</a>
    </div>
</body>
</html>
