{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ student.first_name }} {{ student.last_name }} - Student Profile</title>
    <link rel="stylesheet" href="{% static 'css/student-theme.css' %}">
</head>
<body>
    <div class="page-shell">
        <div class="card detail-card">
            <header class="page-header"><div><p class="eyebrow">Student Profile</p><h1>{{ student.first_name }} {{ student.last_name }}</h1></div><a href="{% url 'student_list' %}" class="btn btn-secondary">Back to List</a></header>
            <div class="student-profile">
                <div class="profile-row"><span class="label">Email</span><span>{{ student.email }}</span></div>
                <div class="profile-row"><span class="label">Age</span><span>{{ student.age }} years old</span></div>
                <div class="profile-row"><span class="label">Department</span><span>{{ student.department }}</span></div>
            </div>
            <div class="form-actions"><a href="{% url 'student_edit' student.pk %}" class="btn btn-primary">Edit Student</a><a href="{% url 'student_delete' student.pk %}" class="btn btn-danger">Delete Student</a></div>
        </div>
    </div>
</body>
</html>
