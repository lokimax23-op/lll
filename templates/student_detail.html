{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ student.first_name }} {{ student.last_name }} - Student Profile</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveBackground 20s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes moveBackground {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .page-shell {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 600px;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
        }

        /* Header Panel */
        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 50px 40px;
            color: white;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .page-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-radius: 50%;
            animation: floatBubble 15s ease-in-out infinite;
        }

        @keyframes floatBubble {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }

        .page-header > div {
            position: relative;
            z-index: 1;
        }

        .eyebrow {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 600;
            margin-bottom: 10px;
            animation: slideInLeft 0.6s ease-out 0.1s both;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .page-header h1 {
            font-size: 32px;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            animation: slideInLeft 0.6s ease-out 0.2s both;
        }

        .page-header .btn {
            animation: slideInRight 0.6s ease-out 0.3s both;
            align-self: center;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Student Profile */
        .student-profile {
            padding: 40px;
            display: grid;
            gap: 25px;
            animation: fadeIn 0.8s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .profile-row {
            display: grid;
            grid-template-columns: 150px 1fr;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
            border-radius: 12px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
            animation: slideUp 0.5s ease-out both;
        }

        .profile-row:nth-child(1) { animation-delay: 0.1s; }
        .profile-row:nth-child(2) { animation-delay: 0.15s; }
        .profile-row:nth-child(3) { animation-delay: 0.2s; }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-row:hover {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            border-left-color: #764ba2;
            transform: translateX(8px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.15);
        }

        .profile-row .label {
            font-weight: 700;
            color: #667eea;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .profile-row span:last-child {
            color: #1f2937;
            font-size: 15px;
            font-weight: 500;
        }

        /* Form Actions */
        .form-actions {
            display: flex;
            gap: 12px;
            padding: 30px 40px;
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
            animation: slideUp 0.6s ease-out 0.35s both;
        }

        .form-actions .btn {
            flex: 1;
        }

        /* Button Styles */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            position: relative;
            z-index: 1;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
            border: 2px solid #e5e7eb;
            position: relative;
            z-index: 1;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
            border-color: #d1d5db;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .btn-secondary:active {
            transform: translateY(0);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            position: relative;
            z-index: 1;
        }

        .btn-danger:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
        }

        .btn-danger:active {
            transform: translateY(-1px);
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .page-header {
                flex-direction: column;
                padding: 40px 25px;
                align-items: stretch;
            }

            .page-header h1 {
                font-size: 24px;
            }

            .page-header .btn {
                width: 100%;
                align-self: flex-start;
            }

            .student-profile {
                padding: 25px;
                gap: 20px;
            }

            .profile-row {
                grid-template-columns: 120px 1fr;
                padding: 16px;
            }

            .form-actions {
                flex-direction: column;
                padding: 25px;
            }

            .form-actions .btn {
                width: 100%;
            }
        }

        :focus-visible {
            outline: 2px solid #667eea;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <div class="card detail-card">
            <div class="page-header">
                <div>
                    <p class="eyebrow">👤 Student Profile</p>
                    <h1>{{ student.first_name }} {{ student.last_name }}</h1>
                </div>
                <a href="{% url 'student_list' %}" class="btn btn-secondary">← Back to List</a>
            </div>

            <div class="student-profile">
                <div class="profile-row">
                    <span class="label">Email</span>
                    <span>{{ student.email }}</span>
                </div>
                <div class="profile-row">
                    <span class="label"> Age</span>
                    <span>{{ student.age }} years old</span>
                </div>
                <div class="profile-row">
                    <span class="label"> Department</span>
                    <span>{{ student.department }}</span>
                </div>
            </div>

            <div class="form-actions">
                <a href="{% url 'student_edit' student.pk %}" class="btn btn-primary">✏️ Edit Student</a>
                <a href="{% url 'student_delete' student.pk %}" class="btn btn-danger">🗑️ Delete Student</a>
            </div>
        </div>
    </div>
</body>
</html>
