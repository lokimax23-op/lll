<header class="site-header">
    <nav class="topbar" aria-label="Main navigation">
        <a class="nav-brand" href="{% url 'home' %}" aria-label="GameCaptain Code home">
            <span class="brand-mark">GC</span>
            <span>GameCaptain</span>
            <span class="brand-divider">/</span>
            <span class="brand-section">CODE</span>
        </a>
        <div class="nav-links">
            <a href="{% url 'code_feed' %}">Explore</a>
            <a href="{% url 'student_list' %}">Developers</a>
        </div>
        <div class="user-info">
            {% if user.is_authenticated %}
                <span class="user-greeting">@{{ user.username }}</span>
                {% if user.is_staff or user.is_superuser %}
                    <a href="{% url 'admin:index' %}" class="btn btn-secondary btn-small">Admin</a>
                    <a href="{% url 'student_list' %}" class="btn btn-secondary btn-small">Manage developers</a>
                    <a href="{% url 'student_add' %}" class="btn btn-primary btn-small">Add developer</a>
                {% else %}
                    <a href="{% url 'game_code' %}" class="btn btn-primary btn-small">Publish code</a>
                {% endif %}
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="logout-btn">Sign out</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}?next={% url 'game_code' %}" class="nav-login">Sign in</a>
            {% endif %}
        </div>
    </nav>
</header>
