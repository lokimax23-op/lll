{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Form</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
    <style>
        
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(
        135deg,
        #080808,
        #170606,
        #090909
    );

    font-family: Arial, sans-serif;
}

.table {
    width: 380px;
    padding: 35px;

    background: linear-gradient(
        145deg,
        #171717,
        #0d0d0d
    );

    border: 1px solid #7f1d1d;
    border-radius: 18px;

    box-shadow:
        0 0 25px rgba(220, 38, 38, 0.15),
        0 20px 50px rgba(0, 0, 0, 0.6);

    box-sizing: border-box;
}

.table form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.table input {
    width: 100%;
    padding: 15px;

    box-sizing: border-box;

    background: #111111;
    color: #ffffff;

    border: 1px solid #4b2020;
    border-radius: 10px;

    outline: none;
    font-size: 14px;

    transition: 0.3s ease;
}

.table input::placeholder {
    color: #777;
}

.table input:hover {
    border-color: #7f1d1d;
}

.table input:focus {
    border-color: #ef4444;

    box-shadow:
        0 0 0 3px rgba(239, 68, 68, 0.12),
        0 0 15px rgba(239, 68, 68, 0.1);
}

.table button {
    width: 100%;
    padding: 15px;

    margin-top: 5px;

    border: 1px solid #ef4444;
    border-radius: 10px;

    background: linear-gradient(
        135deg,
        #991b1b,
        #dc2626
    );

    color: white;

    font-size: 15px;
    font-weight: 600;

    cursor: pointer;

    transition: 0.3s ease;
}

.table button:hover {
    background: linear-gradient(
        135deg,
        #dc2626,
        #ef4444
    );

    border-color: #ff6b6b;

    box-shadow:
        0 0 20px rgba(239, 68, 68, 0.3);

    transform: translateY(-2px);
}

.table button:active {
    transform: translateY(0);
}


    </style>
</head>
<body>
    <div class="table">
        <form action="{% url 'submit_form' %}" method="POST" class="">
            {% csrf_token %}
            <input type="text" placeholder="Enter your name" name="name"> <br>
            <input type="text" placeholder="Enter your department" name="department"> <br>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
